version: "3.8"

services:
  superchat:
    image: aeolun/superchat:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6465:6465" # TCP protocol
      - "6466:6466" # SSH protocol
      - "8080:8080" # WebSocket/HTTP
    volumes:
      - superchat-data:/data
    restart: unless-stopped
    environment:
      - TZ=UTC
      # Configuration overrides (optional)
      # - SUPERCHAT_SERVER_TCP_PORT=6465
      # - SUPERCHAT_SERVER_SSH_PORT=6466
      # - SUPERCHAT_LIMITS_MAX_MESSAGE_LENGTH=4096
      # - SUPERCHAT_LIMITS_MESSAGE_RATE_LIMIT=10
      # - SUPERCHAT_RETENTION_DEFAULT_RETENTION_HOURS=168
      # - SUPERCHAT_DISCOVERY_SERVER_NAME=My SuperChat Server
      # - SUPERCHAT_DISCOVERY_SERVER_DESCRIPTION=Welcome to my community!
      # - SUPERCHAT_DISCOVERY_PUBLIC_HOSTNAME=superchat.example.com
      # - SUPERCHAT_DISCOVERY_MAX_USERS=100
      #
      # Archive: uncomment to enable forwarding to the archiver service
      # - SUPERCHAT_ARCHIVE_ENABLED=true
      # - SUPERCHAT_ARCHIVE_ENDPOINT=archiver:6470

  archiver:
    image: aeolun/superchat-archiver:latest
    build:
      context: .
      dockerfile: Dockerfile.archiver
    ports:
      - "6470:6470" # Archive protocol
      - "8081:80"    # Archive HTML (nginx)
    volumes:
      - archiver-data:/data
    restart: unless-stopped
    environment:
      - TZ=UTC
      # - ARCHIVER_LISTEN=:6470
      # - ARCHIVER_DB=/data/archive.db
      # - ARCHIVER_HTML_INTERVAL=300
      #
      # Word filter: the archiver censors independently of the server feeding
      # it, since it keeps its own copy and publishes it as public HTML.
      # - ARCHIVER_WORD_FILTER=true
      # - ARCHIVER_WORD_FILTER_BACKFILL=true
      # - ARCHIVER_WORD_FILTER_EXTRA=someterm,some phrase
      # - ARCHIVER_WORD_FILTER_REMOVE=chink,coon
      # - ARCHIVER_WORD_FILTER_ALLOW=someword

  website:
    image: aeolun/superchat-website:latest
    build:
      context: .
      dockerfile: website/Dockerfile
    ports:
      - "8080:80" # Nginx serves on port 80 internally
    restart: unless-stopped
    environment:
      - TZ=UTC

volumes:
  superchat-data:
    driver: local
  archiver-data:
    driver: local
