# SuperChat Server Configuration
# Copy this file to ~/.superchat/config.toml and customize as needed

[server]
tcp_port = 6465
ssh_port = 6466
ssh_host_key = "~/.superchat/ssh_host_key"
database_path = "~/.superchat/superchat.db"

[limits]
max_connections_per_ip = 10
message_rate_limit = 10  # messages per minute
max_message_length = 4096  # bytes
max_nickname_length = 20
session_timeout_seconds = 60

[retention]
default_retention_hours = 168  # 7 days
cleanup_interval_minutes = 60

[moderation]
# Replace racial and ethnic slurs with asterisks before the message is stored,
# so the filter covers live broadcasts, history, the archiver and its HTML.
word_filter = true

# Log censored messages with the author's nickname and IP (how you find out who
# to ban -- an anonymous poster's IP is not visible anywhere else).
log_filtered = true

# Censor already-stored messages on startup, so history and newly-added terms
# are covered. One pass over the Message table per boot.
backfill_on_start = true

# extra_words  = ["someterm", "some phrase"]
# remove_words = ["chink", "coon"]  # built-ins with legitimate English uses
# allow_words  = ["someword"]

[channels]
# Default channels to seed on first run
seed_channels = [
  { name = "general", description = "General discussion" },
  { name = "tech", description = "Technical topics" },
  { name = "random", description = "Off-topic chat" },
  { name = "feedback", description = "Bug reports and feature requests" }
]
